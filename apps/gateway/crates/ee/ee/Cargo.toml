[package]
name = "ee"
version = "0.0.0"
edition = "2021"
# Formerly enterprise-licensed, now Apache-2.0 like everything else in this
# fork — kept as a separate workspace member at the same path because the
# free crates depend on it by path (see `apps/gateway/Cargo.toml`); nothing
# about that dependency direction changed, only the license.
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
approval = { path = "../../approval" }
apps = { path = "../../apps" }
cache = { path = "../../cache" }
common = { path = "../../common" }
context = { path = "../../context" }
crypto = { path = "../../crypto" }
db = { path = "../../db" }
inject = { path = "../../inject" }
shutdown = { path = "../../shutdown" }
telemetry = { path = "../../telemetry" }
http-body-util = { workspace = true }
hyper = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Test-only back-edge (Risk: policy-engine depends on ee in production, so
# this must never appear under [dependencies]): the licensed principal CTE's
# parity test compares `find_principal_set` against the free twin
# `policy_engine::find_direct_user_principals` (re-exported `#[doc(hidden)]`
# for exactly this purpose — see `policy-engine/src/lib.rs`). Dev-dependency
# cycles are fine in Cargo; only a normal-dependency cycle would not build.
[dev-dependencies]
policy-engine = { path = "../../policy-engine" }
# Budget and RBAC DB tests write rows against a shared, migrated Postgres
# database (`GATEWAY_TEST_DATABASE_URL`), not a scratch-per-test one, so every
# row they insert needs a collision-proof id.
uuid = { workspace = true }
