[package]
name = "client-ca"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# `x509-parser` turns on `CertificateSigningRequestParams::from_pem`'s CSR
# signature verification (see `authority.rs`'s SECURITY note on `sign_csr`) —
# load-bearing, not decoration.
rcgen = { workspace = true, features = ["x509-parser"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Compiles `test_support` (the loopback-handshake PKI harness) into a build
# that isn't itself a `cargo test` of this crate — for `relay`/`server`,
# which dev-depend on this crate with the feature enabled so their OWN test
# binaries can reuse the harness instead of duplicating it. Never enabled by
# a production build: `cargo build --workspace` never turns this on, and
# `[dependencies]` (not `[dev-dependencies]`) never lists it either.
test-support = []
